server:
  name: "stats-service"
  port: 9090
  mode: "debug"
  read_timeout: 60s
  write_timeout: 60s

mysql:
  dsn: "root:123456@tcp(127.0.0.1:3306)/cashparty?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 3600

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 50

log:
  level: "debug"
  filename: "logs/stats.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
