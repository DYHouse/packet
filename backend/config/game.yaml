server:
  name: "game-service"
  grpc_port: 50051
  mode: "debug"

timeout:
  seat: 30s
  ready: 3s
  grab: 20s
  send: 30s
  replace: 30s
  robot: 5s
  check_interval: 1s
  handler_timeout: 30s

settlement_scheduler:
  credit_retry:
    interval: 30s
    initial_delay: 10s
    lock_ttl: 60
    limit: 100
  settlement_check:
    interval: 5m
    initial_delay: 1m
    lock_ttl: 300
    deducted_not_settled_lookback: 5m
    failed_first_round_lookback: 10m
  refund_process:
    interval: 1m
    initial_delay: 30s
    lock_ttl: 120
    limit: 100
    offset: 0
  game_settle_retry:
    interval: 30s
    initial_delay: 15s
    lock_ttl: 60
  game_settle_timeout:
    interval: 5m
    initial_delay: 1m
    lock_ttl: 300
    timeout_duration: 1h
    limit: 100

lock:
  first_round_deduct_lock_ttl: 60s
  later_round_deduct_lock_ttl: 30s
  system_packet_deduct_lock_ttl: 30s
  settle_round_lock_ttl: 30s
  game_settle_lock_ttl: 60s
  game_settle_retry_lock_ttl: 30s
  credit_retry_lock_ttl: 30s
  refund_apply_lock_ttl: 30s
  refund_approve_lock_ttl: 30s
  refund_reject_lock_ttl: 30s
  send_packet_lock_ttl: 10s
  send_timeout_lock_ttl: 10s
  replace_timeout_lock_ttl: 30s
  game_app_settle_lock_ttl: 30s

redis_ttl:
  room_data_ttl: 86400s
  user_room_ttl: 86400s
  queue_ttl: 86400s
  penalty_record_ttl: 86400s
  packet_data_ttl: 86400s
  round_state_ttl: 86400s
  penalty_count_ttl: 86400s

redis:
  mode: "standalone"
  # 本地开发：通过 SSH 隧道转发到 AWS ElastiCache (Valkey TLS)
  #   ssh -i cashparty.pem -N -L 6379:master.cashparty.q7vjko.cnw1.cache.amazonaws.com.cn:6379 ec2-user@<ec2公网IP>
  # 生产部署：addr 改为 ElastiCache 真实端点（同 VPC 可直连）
  addr: "127.0.0.1:6379"
  password: "Cashparty20262026"    # ElastiCache AUTH Token
  db: 0
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  master_name: ""
  sentinel_addrs: []
  cluster_addrs: []               # Cluster 模式节点地址列表（预留，本次不实现）
  tls:                            # TLS 传输加密配置（对接 AWS ElastiCache Valkey TLS 时启用）
    enable: true
    insecure_skip_verify: true    # ElastiCache 自签名证书，必须设为 true
    ca_cert_path: ""
    cert_path: ""
    key_path: ""
    server_name: ""

mysql:
  dsn: "root:123456@tcp(127.0.0.1:3306)/cashparty?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 3600

kafka:
  brokers:
    - "127.0.0.1:9092"

broadcast:
  mode: "redis_pubsub"
  kafka:
    topic: "cashparty.gateway.broadcast"
  redis_pubsub:
    channel: "cashparty:gateway:broadcast"

platform:
  provider: "mock"
  base_url: "https://dev.mars.bingo/api/channel/envelope-dev"
  merchant_id: "10001"
  merchant_secret: "aca5d11a-e481-4163-9505-194564558ae3"
  game_id: 1
  game_code: "redpacket"
  game_name: "redpacket"
  currency: "MXN"
  timeout: 5s
  max_retries: 3

log:
  level: "debug"
  filename: "logs/game.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

nacos:
  enabled: true
  server_addr: "127.0.0.1:8848"
  namespace: ""
  group: "DEFAULT_GROUP"
  username: "nacos"
  password: "nacos"
  service_name: "game-service"
  service_addr: "127.0.0.1"
  service_port: 50051
  config_data_id: "game-service.yaml"
  config_group: "DEFAULT_GROUP"
  algorithm_data_id: "algorithm.yaml"
  algorithm_group: "DEFAULT_GROUP"
  rate_limiter_data_id: "game-ratelimiter.yaml"
  rate_limiter_group: "DEFAULT_GROUP"

id_generator:
  enabled: true
  # 节点 ID，范围 [0, 1023]。
  # 0 表示 Redis 自动分配（多实例生产环境推荐，通过 nacos 下发统一配置）
  # >0 表示显式指定（单实例/测试环境；多实例部署时每个实例必须唯一）
  # 多实例部署禁止使用默认值 1，否则会产生 ID 冲突
  node_id: 1

avatar:
  base_url: "https://opc.narrytech.cn/avatars"
  default_count: 60

robot:
  enabled: true
  scheduler:
    scan_interval: 30s
    min_real_players: 2
    max_robots_per_room: 3
    robot_assign_lock_ttl: 10s
    room_assign_lock_ttl: 30s
    recycle_cooldown: 60s
    reserve_count: 5
    reserve_ratio_max: 0.3
  behavior:
    seat_delay_min: 2s
    seat_delay_max: 5s
    ready_delay_min: 1s
    ready_delay_max: 3s
    grab_delay_min: 1s
    grab_delay_max: 8s
    grab_skip_prob: 0.05
    send_delay_min: 2s
    send_delay_max: 5s
    leave_after_game_min: 3s
    leave_after_game_max: 10s
    action_retry_max: 2
    action_retry_delay: 2s
  account:
    initial_balance_multi: 1.5
    low_balance_threshold: 0.5
    sync_interval: 30s
