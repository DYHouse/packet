server:
  name: gateway-service
  port: 8080
  mode: debug
  test_enabled: true
  read_timeout: 60s
  write_timeout: 60s

gateway:
  read_buffer_size: 4096
  write_buffer_size: 4096
  send_queue_size: 256
  max_connections: 10000
  allowed_origins:
    - "*"

redis:
  mode: "standalone"
  # 本地开发：连接 docker-compose 里的 redis 容器（明文，无 AUTH）
  # 生产部署：可改回 AWS ElastiCache (Valkey TLS)，启用 tls + password
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  master_name: ""
  sentinel_addrs: []
  cluster_addrs: []               # Cluster 模式节点地址列表（mode=cluster 时填写）
  tls:
    enable: false
    insecure_skip_verify: false
    ca_cert_path: ""
    cert_path: ""
    key_path: ""
    server_name: ""

nacos:
  enabled: true
  server_addr: "127.0.0.1:8848"
  namespace: ""
  group: "DEFAULT_GROUP"
  username: "nacos"
  password: "nacos"
  service_name: "gateway-service"
  service_addr: "127.0.0.1"
  service_port: 8080
  config_data_id: "gateway-service.yaml"
  config_group: "DEFAULT_GROUP"
  router_data_id: "gateway-router.yaml"
  router_group: "DEFAULT_GROUP"

kafka:
  enabled: true
  # 本地开发：使用 docker-compose 启动的本地 Kafka（PLAINTEXT，无 SASL/TLS）
  # 生产部署：改回 AWS MSK (SASL OAUTHBEARER + TLS)
  brokers:
    - "127.0.0.1:9092"
  sasl:
    mechanism: ""
    region: ""
    username: ""
    password: ""
  tls:
    enabled: false
    ca_cert_path: ""
    insecure_skip_verify: false

broadcast:
  mode: "redis_pubsub"
  kafka:
    topic: "cashparty.gateway.broadcast"
  redis_pubsub:
    channel: "cashparty:gateway:broadcast"

merchant:
  id: "10001"
  secret: "aca5d11a-e481-4163-9505-194564558ae3"
  game_entry_url: "http://43.135.35.31"
  ws_url: "ws://43.135.35.31/ws"

token:
  secret_key: "your-256-bit-secret-key-here-min-32-characters"
  token_ttl: 2h
  issuer: "gateway-service"

log:
  level: debug
  filename: "logs/gateway.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

id_generator:
  enabled: true
  # 节点 ID，范围 [0, 1023]。
  # 0 表示 Redis 自动分配（多实例生产环境推荐，通过 nacos 下发统一配置）
  # >0 表示显式指定（单实例/测试环境；多实例部署时每个实例必须唯一）
  # 多实例部署禁止使用默认值 1，否则会产生 ID 冲突
  node_id: 1

# Auth 锁定配置（Redis 持久化，多实例共享）
auth_lock:
  max_attempts: 5          # 最大失败尝试次数
  lock_duration: "15m"      # 锁定时长
  counter_window: "15m"    # 失败计数窗口

# 头像上传配置（仅 gateway 服务使用）
# 默认头像配置（base_url / default_count）仍归 game 服务管理，见 config/game.yaml
avatar:
  upload:
    upload_dir: "/var/lib/cashparty/avatars/uploads"
    public_base_url: "https://opc.narrytech.cn/avatars/uploads"
    max_size_bytes: 2097152  # 2MB
    allowed_types: ["image/png", "image/jpeg", "image/webp"]
